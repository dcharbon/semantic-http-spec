$schema: https://semantic-http-spec.org/mapping-schema/v0.1
endpoints:
- context:
    url: https://semantic.example.com/context.jsonld
  methods:
    get:
      enabled: true
      responseMapping:
        fields:
        - description: User ID
          required: true
          semantic: id
          semantic_property: schema:identifier
          source: $.id
          transform: null
          type: string
        - description: Email address
          required: true
          semantic: email
          semantic_property: schema:email
          source: $.email
          transform: null
          type: string
        - description: Full name
          required: false
          semantic: name
          semantic_property: schema:name
          source: $.name
          transform: null
          type: string
        - description: Phone number
          required: false
          semantic: phone
          semantic_property: schema:telephone
          source: $.phone
          transform: null
          type: string
        - description: Creation date
          required: false
          semantic: created_at
          semantic_property: schema:DateTime
          source: $.created_at
          transform: null
          type: string
      responses:
        '200':
          context: https://semantic.example.com/context.jsonld
          description: Success
          schema: https://semantic.example.com/schema.json
  path: /users/{id}
  schema:
    deriveFrom: transform
    url: https://semantic.example.com/schema.json
  semanticType: schema:Person
  source:
    path: /users/{id}
metadata:
  apiName: Example User API
  apiVersion: v1
  baseUrl: https://api.example.com
  mappingVersion: 1.0.0
  semanticBaseUrl: https://semantic.example.com
semanticContext:
  contextUrl: https://semantic.example.com/context.jsonld
  vocabularies:
  - namespace: schema
    uri: http://schema.org/
version: '0.1'
