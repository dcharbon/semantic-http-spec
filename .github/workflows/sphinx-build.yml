name: Build and Deploy Jupyter Book Documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'source/**'
      - '_config.yml'
      - '_toc.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/sphinx-build.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'source/**'
      - '_config.yml'
      - '_toc.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync

    - name: Build Jupyter Book
      run: |
        uv run jupyter-book build . --path-output ./
        mv _build/html docs
        touch docs/.nojekyll

    - name: Commit and push if changes
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-build documentation [skip ci]" && git push)
